# 실험 — "고가 모델을 섞으면 품질이 더 나은가?" (Grok 검수 5번 / 기획 §1-8)
# 작업별로 [우리 저가 픽] vs [고가 Opus]를 독립 심판(Gemini-Flash)이 채점.
# 목적: 고가가 '의미 있게' 이기는 작업만 승격 후보. 아니면 '전부 저가'를 정직하게 유지.
# 실행: npx promptfoo eval -c eval/flagship-mix.yaml -o eval/flagship-mix-results.json
# (.env의 OPENROUTER_API_KEY 자동 로드 · 실제 API 소액 과금 · Opus 포함이라 기존보다 약간 큼)
description: 고가(Opus) 섞기 품질 A/B — 대학생 해커톤 첫 회의 맥락

prompts:
  - file://prompts/chat.json

providers:
  - id: openrouter:upstage/solar-pro4
    label: Solar(우리·발산/분석)
  - id: openrouter:deepseek/deepseek-v3.2
    label: DeepSeek(우리·보고)
  - id: openrouter:anthropic/claude-opus-4.1
    label: Opus(고가)

defaultTest:
  options:
    provider:
      id: openrouter:google/gemini-2.5-flash
      config:
        temperature: 0

tests:
  - description: idea (발산 — 4관점)
    vars:
      system: "너는 아이디어 발산 전문가다. 목표에 대해 [사업성][사용자경험][기술][참신함] 4관점에서 각각 겹치지 않는 새 아이디어 하나씩, 각 2문장 이내 한국어로 제안한다. 참신하되 실제로 만들 수 있는 단위여야 하며, 유행어로 때우거나 비현실적 공상은 피한다."
      user: "목표: 교내 해커톤(2일)에서 대학생 팀이 만들 서비스 아이디어"
    assert:
      - type: llm-rubric
        value: "4관점이 실제로 겹치지 않고 구분되는가, 각 아이디어가 2일 해커톤에 현실적이고 구체적인가, 유행어·공상 없이 만들 수 있는 단위인가. 이 세 가지를 종합해 채점."
  - description: analyze (아이디어 테마 묶기)
    vars:
      system: "너는 분석가다. 제출된 아이디어들을 3~4개 테마로 묶고 공통 구조를 짧게 요약한다. 한국어."
      user: |
        목표: 대학생 캠퍼스 생활을 돕는 서비스
        아이디어:
        - 강의실 빈자리 실시간 표시
        - 과제 공지 한 곳 모으기
        - 학식 취향 추천
        - 조별과제 무임승차 상호평가
        - 중고 전공서적 매칭
    assert:
      - type: llm-rubric
        value: "테마 묶음이 아이디어를 정확히 반영하는가(엉뚱한 분류 없음), 공통 구조 요약이 피상적이지 않고 통찰이 있는가, 팀이 다음 결정에 쓸 만큼 명료한가."
  - description: report (세션 결과 종합)
    vars:
      system: "너는 정리 담당이다. 세션 결과를 종합한 짧은 보고서 초안을 작성한다."
      user: |
        목표: 대학생 캠퍼스 생활을 돕는 서비스
        선정 방향: 강의실 빈자리 실시간 표시
        제출 아이디어: 빈자리 표시 / 과제 공지 모으기 / 학식 추천 / 무임승차 평가
    assert:
      - type: llm-rubric
        value: "선정 방향의 핵심가치·타겟·리스크가 구체적으로 잡혔는가, 제출 아이디어를 실제로 반영했는가(일반론 아님), 해커톤 발표에 바로 쓸 만큼 실용적인가."
