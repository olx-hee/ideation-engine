<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A1 로그인 · IdeationEngine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../../assets/css/tokens.css">
<link rel="stylesheet" href="../../assets/css/components.css">
<link rel="stylesheet" href="../../assets/css/shell.css">
</head>
<body data-screen="A1-login">
<!--
  ===== 화면 A1 · 로그인 =====
  보는 사람 : 누구나
  설명·API  : README.md (같은 폴더)
  동작      : screen.js
  크기      : 1280×800 기준 보드를 창에 맞춰 확대/축소 (assets/js/app.js · fit)
-->
<main class="stage">
<div class="board">

    <div class="split">
  
      <div class="brandside">
        <div class="bl"><svg class="appicon" width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#FFFFFF"/><rect x="8.1" y="9" width="3.4" height="14" rx="0.7" fill="#4F46E5"/><rect x="14.1" y="9" width="3.4" height="14" rx="0.7" fill="#4F46E5"/><rect x="14.1" y="9" width="9.8" height="3.4" rx="0.7" fill="#4F46E5"/><rect x="14.1" y="14.3" width="8.0" height="3.4" rx="0.7" fill="#4F46E5"/><rect x="14.1" y="19.6" width="9.8" height="3.4" rx="0.7" fill="#4F46E5"/></svg>IdeationEngine</div>
  
        <div class="bh">다시 오신 걸<br>환영해요</div>
        <ul>
          <li><i>👤</i>내 프로필이 세션마다 자동 적용</li>
          <li><i>🗂️</i>지난 세션 보고서 다시 보기</li>
          <li><i>⚡</i>세션 만들기까지 10초</li>
        </ul>
  
        <div class="bf">대학생 해커톤·공모전 팀을 위한 오프라인 아이디어 세션</div>
      </div>
  
      <div class="formside"><span class="back" data-go="../01-landing/index.html">← 처음으로</span>
    
        <div class="form">
      <p class="lead">로그인</p><p class="hint" style="margin-bottom:24px">이메일 또는 소셜 계정으로 로그인하세요</p>
      
          <div class="social"><button class="btn google" data-action="oauth"><span class="gmark"></span>Google로 계속</button><button class="btn kakao" data-action="oauth">💬 카카오로 계속</button></div>
      
          <div class="divider" style="margin:20px 0">또는 이메일로</div>
      
          <div class="fgroup">
            <div class="fl">이메일</div><input class="inp" value="hyeongwon@example.com">
          </div>
      
          <div class="fgroup">
            <div class="fl">비밀번호 <a data-action="resetPw">비밀번호 찾기</a></div>
            <label class="inp pw"><input class="bare" type="password" value="password1234" autocomplete="current-password"><span class="eye" title="비밀번호 보기">👁</span></label>
          </div>
      
          <div class="check" style="margin-top:14px"><span class="box on">✓</span>로그인 상태 유지</div>
      <button class="btn block lg" style="margin-top:20px" data-action="login">로그인</button>
      <p class="alt">계정이 없나요? <a data-action="goSignup">회원가입</a></p>
    
        </div>
  
      </div>

    </div>
</div>
</main>

<script src="../../assets/js/config.js"></script>
<script src="../../assets/js/endpoints.js"></script>
<script src="../../assets/js/mock.js"></script>
<script src="../../assets/js/screens.js"></script>
<script src="../../assets/js/app.js"></script>
<script src="../../assets/js/api.js"></script>
<script src="screen.js"></script>
</body>
</html>
