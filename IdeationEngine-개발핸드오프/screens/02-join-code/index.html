<main class="stage">
<div class="board">

    <div class="appbar"><span class="applogo"><svg class="appicon" width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#4F46E5"/><rect x="8.1" y="9" width="3.4" height="14" rx="0.7" fill="#FFFFFF"/><rect x="14.1" y="9" width="3.4" height="14" rx="0.7" fill="#FFFFFF"/><rect x="14.1" y="9" width="9.8" height="3.4" rx="0.7" fill="#FFFFFF"/><rect x="14.1" y="14.3" width="8.0" height="3.4" rx="0.7" fill="#FFFFFF"/><rect x="14.1" y="19.6" width="9.8" height="3.4" rx="0.7" fill="#FFFFFF"/></svg>IdeationEngine</span><span class="pbtn" data-go="../A1-login/index.html"><span class="avatar guest">👤</span>로그인 전 ▾</span></div>

    <div class="abody">
      <div class="center" style="padding-bottom:40px">
        <div class="panel">
  <p class="lead">방 코드를 입력하세요</p>
  <p class="hint" style="margin-bottom:24px">진행자 화면에 보이는 6자리 코드</p>
  
          <div class="codebox"><input class="f" maxlength="1" value="7" aria-label="방 코드"><input class="f" maxlength="1" value="K" aria-label="방 코드"><input class="f" maxlength="1" value="2" aria-label="방 코드"><input maxlength="1" data-autofocus aria-label="방 코드"><input maxlength="1" aria-label="방 코드"><input maxlength="1" aria-label="방 코드"></div>
  
          <div class="divider" style="margin:28px 0 16px">또는 초대 링크로</div>
  
          <div style="display:flex;gap:8px"><input class="inp" style="text-align:left;font-family:var(--mono);font-size:var(--fs-sm)" placeholder="https://ideationengine.app/s/…"><button class="btn ghost" data-action="pasteLink">붙여넣기</button></div>
  <button class="btn block" style="margin-top:28px" data-action="join">입장하기 →</button>

        </div>
      </div>
